name: Build Firmware

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    name: PlatformIO build — LilyGo T-Embed Plus
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach binaries to GitHub Releases

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python + PlatformIO ───────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: pip install platformio

      # ── 3. Generate config.h from GitHub Secrets ─────────────────────────────
      #    Secrets used:
      #      WIFI_SSID       — your WiFi network name
      #      WIFI_PASSWORD   — your WiFi password
      #      LOCAL_LLM_HOST  — IP address of your resurrection engine server
      #      LOCAL_LLM_PORT  — port (default: 5000)
      #    If a secret is not set the placeholder value from config.h.example
      #    is used so the firmware still compiles (API calls will fail at runtime).
      - name: Generate firmware/src/config.h
        env:
          WIFI_SSID:      ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD:  ${{ secrets.WIFI_PASSWORD }}
          LOCAL_LLM_HOST: ${{ secrets.LOCAL_LLM_HOST }}
          LOCAL_LLM_PORT: ${{ secrets.LOCAL_LLM_PORT }}
        run: |
          python3 - <<'EOF'
          import os, pathlib, textwrap
          ssid     = os.environ.get("WIFI_SSID",      "YourWiFiSSID")
          passwd   = os.environ.get("WIFI_PASSWORD",  "YourWiFiPassword")
          llm_host = os.environ.get("LOCAL_LLM_HOST", "192.168.1.100")
          llm_port = os.environ.get("LOCAL_LLM_PORT", "5000")

          # Sanitise — strip quotes that could break the C string literal
          def safe(s): return s.replace('"', '\\"').replace('\\', '\\\\')

          content = textwrap.dedent(f"""\
              #pragma once
              // Auto-generated by GitHub Actions — do NOT commit
              #define WIFI_SSID      "{safe(ssid)}"
              #define WIFI_PASSWORD  "{safe(passwd)}"
              #define LOCAL_LLM_HOST "{safe(llm_host)}"
              #define LOCAL_LLM_PORT "{safe(llm_port)}"
              #define PIN_TFT_MOSI    11
              #define PIN_TFT_SCLK    12
              #define PIN_TFT_CS      10
              #define PIN_TFT_DC      13
              #define PIN_TFT_RST      9
              #define PIN_TFT_BL      15
              #define PIN_ENCODER_A    1
              #define PIN_ENCODER_B    2
              #define PIN_ENCODER_BTN 21
              #define PIN_SPEAKER     46
          """)
          pathlib.Path("firmware/src/config.h").write_text(content)
          print("config.h written successfully")
          EOF

      # ── 4. Build ─────────────────────────────────────────────────────────────
      - name: Build firmware
        run: |
          cd firmware
          pio run --environment lilygo-t-embed-plus

      # ── 5. Upload build artefact ─────────────────────────────────────────────
      - name: Upload firmware artefact
        uses: actions/upload-artifact@v4
        with:
          name: resurrected-ai-firmware-${{ github.sha }}
          path: |
            firmware/.pio/build/lilygo-t-embed-plus/firmware.bin
            firmware/.pio/build/lilygo-t-embed-plus/bootloader.bin
            firmware/.pio/build/lilygo-t-embed-plus/partitions.bin
          if-no-files-found: error

      # ── 6. Attach binaries to GitHub Release ─────────────────────────────────
      - name: Attach firmware to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware/.pio/build/lilygo-t-embed-plus/firmware.bin
            firmware/.pio/build/lilygo-t-embed-plus/bootloader.bin
            firmware/.pio/build/lilygo-t-embed-plus/partitions.bin
