; PlatformIO project configuration for Resurrected AI Spirit Board
; Target: LilyGo T-Embed Plus (ESP32-S3, ST7789V 170x320 display)

[env:lilygo-t-embed-plus]
platform               = espressif32
board                  = esp32-s3-devkitc-1
framework              = arduino
monitor_speed          = 115200
upload_speed           = 921600

; ESP32-S3 hardware settings
board_build.mcu             = esp32s3
board_build.f_cpu           = 240000000L
board_build.f_flash         = 80000000L
board_build.flash_mode      = qio
board_build.arduino.memory_type = qio_opi   ; 8MB OPI PSRAM
board_build.partitions      = partitions_16MB.csv
board_upload.flash_size     = 16MB
board_upload.maximum_size   = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; ── TFT_eSPI driver config for ST7789V 170×320 ──────────────────────────
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=13
    -DTFT_RST=9
    -DTFT_BL=15
    -DTFT_BACKLIGHT_ON=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.3
